            padding: 20px;
        }
    .container{
    max-width:1400px;
    margin:0 auto;
    display: grid;
    grid-template-columns: 1fr 580px;

/* 右侧关系面板 */

}
.emperor-item{

        }

        }
        /* 右侧关系面板 */

</div>

// 渲染右侧圆点节点
function renderNodes(){
    const container = document.getElementById("nodeContainer");
    container.innerHTML = "";
    data.forEach(person=>{
        const div = document.createElement("div");
        div.className = "person-node";
        div.setAttribute("data-name", person.name);
        div.innerText = person.name.slice(0,1);
        div.onclick = ()=> searchPerson(person.name);
        container.appendChild(div);
    })
}

// 渲染皇帝谱系
function renderEmperorTree(){
    const wrap = document.getElementById("emperorTree");
    wrap.innerHTML = "";
    emperorList.forEach((emp, index)=>{
        const div = document.createElement("div");
        div.className = "emperor-item";
        div.innerHTML = `<b>第${index + 1}位 ${emp.name}</b>（${emp.alias}）<span class="relation">｜在任：${emp.reign}｜${emp.relation}</span>`;
        wrap.appendChild(div);
    })
}


// 搜索函数
function searchPerson(keyword) {
    keyword = keyword.trim()
    const find = data.find(item=>
        item.name.includes(keyword) || item.alias.includes(keyword)
    )
    const emptyTip = document.getElementById("emptyTip");
    const content = document.getElementById("person-content");
    if(!find){
        emptyTip.style.display = "block";
        content.style.display = "none";
        return
    }
    emptyTip.style.display = "none";
    content.style.display = "block";
    document.getElementById("person-name").innerText = find.name + "（"+find.alias+"）"
    document.getElementById("person-meta").innerText = `${find.birthDeath}｜时代：${find.time}`
    document.getElementById("person-intro").innerText = find.intro

    // 同期人物标签点击搜索
    const contempWrap = document.getElementById("person-contemp")
    contempWrap.innerHTML = find.contemporary.map(name=>{
        const pureName = name.split('(')[0];
        return `<span class="tag" onclick="searchPerson('${pureName}')">${name}</span>`
    }).join('')

    // 事件标签
    const eventWrap = document.getElementById("person-events")
    eventWrap.innerHTML = find.events.map(x=>`<span class="tag">${x}</span>`).join('')
}

// 绑定搜索按钮和回车
const input = document.getElementById('search-input')
const btn = document.getElementById('search-btn')
btn.onclick = ()=> searchPerson(input.value)
input.onkeydown = (e)=>{
    if(e.key === 'Enter') searchPerson(input.value)
}

// 页面初始化
renderNodes();
renderEmperorTree();
</script>
</body>
</html>
